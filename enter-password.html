        <h1 class="title" id="loginHeader">Enter your password</h1>

                type="password"
                id="passwordEntry"
                name="passwd"
                autocomplete="current-password"
                aria-describedby="passwordError"
                aria-required="true"
                aria-invalid="true"
              />
              <button
                type="button"
                class="show-button"
                id="showButton"
                aria-label="Show password"
                aria-pressed="false"
                hidden
              >Show</button>
            </div>

              Rendered on load because that is the state captured in
              "Enter your password (10_14_2026 10:15:16 AM).html".
              Remove the "is-visible" class below to start with a clean field.
            -->

  <script src="flow.js"></script>
  <script>
    // ── Page behaviour for the password step ────────────────────────────────
    document.addEventListener('DOMContentLoaded', function () {
      var form        = document.getElementById('passwordForm');
      var shell       = document.getElementById('inputShell');
      var input       = document.getElementById('passwordEntry');
      var showButton  = document.getElementById('showButton');
      var error       = document.getElementById('passwordError');
      var statusLine  = document.getElementById('demoStatus');
      var email       = window.Flow ? window.Flow.email : 'test@test.com';

      // keep the chip aria-label in sync with the account being signed in
      document.getElementById('identityBadge').setAttribute('aria-label', email);

      // ── Floating label: rides to the top once focused or filled ──────────
      function syncLabel() {
        var floating = document.activeElement === input || input.value.length > 0;
        shell.classList.toggle('is-floating', floating);
      }
      input.addEventListener('focus', syncLabel);
      input.addEventListener('blur', syncLabel);
      input.addEventListener('input', syncLabel);

      // ── Show / Hide, only while there is something to reveal ─────────────
      function syncShowButton() {
        showButton.hidden = input.value.length === 0;
      }
      input.addEventListener('input', syncShowButton);

      showButton.addEventListener('click', function () {
        var revealed = input.type === 'text';
        input.type = revealed ? 'password' : 'text';
        showButton.textContent = revealed ? 'Show' : 'Hide';
        showButton.setAttribute('aria-label', revealed ? 'Show password' : 'Hide password');
        showButton.setAttribute('aria-pressed', String(!revealed));
        input.focus();
      });

      // ── Errors ───────────────────────────────────────────────────────────
      function showError(message) {
        document.getElementById('passwordErrorText').textContent = message;
        error.classList.add('is-visible');
        shell.classList.add('has-error');
        input.setAttribute('aria-invalid', 'true');
        statusLine.hidden = true;
      }

      function clearError() {
        error.classList.remove('is-visible');
        shell.classList.remove('has-error');
        input.removeAttribute('aria-invalid');
      }

      input.addEventListener('input', function () {
        if (shell.classList.contains('has-error')) clearError();
      });

      form.addEventListener('submit', function (e) {
        e.preventDefault();

        if (!input.value) {
          showError('Enter your password.');
          input.focus();
          return;
        }

        // Nothing is sent anywhere — this is a static mockup.
        clearError();
        statusLine.textContent = 'Demo only: no password is checked or sent anywhere.';
        statusLine.hidden = false;
      });

      // "Help and feedback" is a flyout on the real page; keep it inert here.
      document.getElementById('helpAndFeedback')
        .addEventListener('click', function () { /* no-op in the mockup */ });

      syncLabel();
      syncShowButton();
    });
  </script>
