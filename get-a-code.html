  <script src="flow.js"></script>
  <script>
    // ── Page behaviour for the "send a code" step ───────────────────────────
    document.addEventListener('DOMContentLoaded', function () {
      var form       = document.getElementById('codeForm');
      var button     = document.getElementById('idSIButton9');
      var statusLine = document.getElementById('demoStatus');
      var email      = window.Flow ? window.Flow.email : 'test@test.com';

      document.getElementById('identityBadge').setAttribute('aria-label', email);

      form.addEventListener('submit', function (e) {
        e.preventDefault();

        // The real page continues to an "Enter code" step; this mockup stops
        // here and just reports what would have happened.
        button.disabled = true;
        statusLine.textContent =
          'Demo only: a code would be sent to ' + email + ' — nothing is really sent.';
        statusLine.hidden = false;
      });

      document.getElementById('helpAndFeedback')
        .addEventListener('click', function () { /* no-op in the mockup */ });
    });
  </script>
