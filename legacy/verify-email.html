  <script src="flow.js"></script>
  <script>
    // ── Page behaviour for the email-verification step ──────────────────────
    document.addEventListener('DOMContentLoaded', function () {
      var form   = document.getElementById('emailForm');
      var shell  = document.getElementById('inputShell');
      var input  = document.getElementById('proof-confirmation-email-input');
      var error  = document.getElementById('emailError');
      var email  = window.Flow ? window.Flow.email : 'test@test.com';

      document.getElementById('identityBadge').setAttribute('aria-label', email);

      // ── Floating label ────────────────────────────────────────────────────
      function syncLabel() {
        var floating = document.activeElement === input || input.value.length > 0;
        shell.classList.toggle('is-floating', floating);
      }
      input.addEventListener('focus', syncLabel);
      input.addEventListener('blur', syncLabel);
      input.addEventListener('input', syncLabel);

      // ── Errors ────────────────────────────────────────────────────────────
      function showError(message) {
        document.getElementById('emailErrorText').textContent = message;
        error.classList.add('is-visible');
        shell.classList.add('has-error');
        input.setAttribute('aria-invalid', 'true');
      }

      input.addEventListener('input', function () {
        error.classList.remove('is-visible');
        shell.classList.remove('has-error');
        input.removeAttribute('aria-invalid');
      });

      form.addEventListener('submit', function (e) {
        e.preventDefault();

        if (!input.value.trim()) {
          showError('Enter the email address for your account.');
          input.focus();
          return;
        }

        // The real page posts the address and continues on the code step.
        window.Flow.goTo(window.Flow.withEmail('enter-code.html'));
      });

      document.getElementById('helpAndFeedback')
        .addEventListener('click', function () { /* no-op in the mockup */ });

      syncLabel();
    });
  </script>
